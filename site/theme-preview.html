<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <title>配色预览 · 赵阳学术主页</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f2ec; color: #2d2a26; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1600px, 100%); margin: 0 auto; padding: 24px 32px 32px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: 25px; font-weight: 600; letter-spacing: .06em; }
    .description { margin: 0; color: #777168; font-size: 13px; line-height: 1.7; }
    .options { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
    .theme-buttons { display: flex; gap: 7px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; padding: 10px 15px; border: 1px solid #d5cec4; border-radius: 4px; background: transparent; color: #635c53; font: inherit; font-size: 13px; cursor: pointer; transition: background-color .15s, border-color .15s; }
    button:hover { background: #ece7de; border-color: #a59a8d; }
    button[aria-pressed="true"] { border-color: #49423b; background: #fffdf9; color: #2d2a26; }
    button:focus-visible, a:focus-visible { outline: 2px solid #5f574d; outline-offset: 4px; }
    .swatch { display: inline-flex; width: 18px; height: 18px; overflow: hidden; border: 1px solid #00000018; border-radius: 50%; }
    .swatch::before, .swatch::after { content: ""; width: 50%; height: 100%; }
    .paper::before { background: #f5f1e9; }
    .paper::after { background: #514b45; }
    .copper::before { background: #f5f1e9; }
    .copper::after { background: #975b36; }
    .lilac::before { background: #f6f4f5; }
    .lilac::after { background: #716080; }
    .open-link { color: #514a42; font-size: 12px; text-decoration-color: #b8aea1; text-underline-offset: 5px; white-space: nowrap; }
    .open-link:hover { color: #161411; text-decoration-color: currentColor; }
    .preview { overflow: hidden; border: 1px solid #d8d0c5; border-radius: 5px; background: #fffdf9; }
    iframe { display: block; width: 100%; height: max(600px, calc(100vh - 150px)); border: 0; background: #fffdf9; }
    @media (max-width: 1050px) {
      .toolbar { align-items: flex-start; }
      .options { flex-direction: column; align-items: flex-end; gap: 12px; }
    }
    @media (max-width: 680px) {
      main { padding: 20px 12px 16px; }
      .toolbar { display: block; margin: 0 6px 18px; }
      h1 { font-size: 23px; }
      .description { max-width: 32em; }
      .options { align-items: stretch; gap: 14px; margin-top: 18px; }
      .theme-buttons { width: 100%; }
      button { flex: 1; padding-inline: 10px; }
      .open-link { align-self: flex-end; }
      .preview { border-radius: 3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="toolbar">
      <div>
        <h1>配色预览</h1>
        <p class="description">三版保留相同排版与内容，可以切换颜色并体验空间交互。</p>
      </div>
      <div class="options">
        <div class="theme-buttons" role="group" aria-label="选择主页配色">
          <button type="button" data-theme="paper" aria-pressed="true" aria-controls="homepage-preview"><span class="swatch paper" aria-hidden="true"></span>纸墨</button>
          <button type="button" data-theme="copper" aria-pressed="false" aria-controls="homepage-preview"><span class="swatch copper" aria-hidden="true"></span>铜棕</button>
          <button type="button" data-theme="lilac" aria-pressed="false" aria-controls="homepage-preview"><span class="swatch lilac" aria-hidden="true"></span>雾紫</button>
        </div>
        <a class="open-link" href="./?theme=paper#about" target="_blank" rel="noopener noreferrer">单独打开当前版本 ↗</a>
      </div>
    </header>
    <div class="preview">
      <iframe id="homepage-preview" src="./?theme=paper#about" title="纸墨配色：赵阳学术主页"></iframe>
    </div>
  </main>
  <script>
    const buttons = document.querySelectorAll('[data-theme]');
    const preview = document.getElementById('homepage-preview');
    const openLink = document.querySelector('.open-link');
    const names = { paper: '纸墨', copper: '铜棕', lilac: '雾紫' };

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        if (button.getAttribute('aria-pressed') === 'true') return;
        const theme = button.dataset.theme;
        const url = `./?theme=${theme}#about`;
        buttons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        preview.title = `${names[theme]}配色：赵阳学术主页`;
        preview.src = url;
        openLink.href = url;
      });
    });
  </script>
</body>
</html>
